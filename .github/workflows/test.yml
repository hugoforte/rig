# The suite, on a pull request and on the merge group that pull request lands in.
#
# `merge_group` is not optional once `main` has a merge queue: a required check that never
# reports against the group's ref leaves every entry stalled until the queue's timeout ejects
# it, and the failure looks like the queue being broken rather than like a missing trigger.
# The job id and the matrix are shared with the `pull_request` run on purpose — the check names
# GitHub matches against the ruleset (`test (ubuntu-latest)`, `test (windows-latest)`) have to
# be identical across the two events, and they are identical because there is one job.

name: test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags: test/scenarios.test.mjs runs the previous release against a
          # machine file this one wrote, and a shallow clone carries no tags to find it by.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
