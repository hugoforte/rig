# Every merge to main is a release, or says why it is not. The version was decided on the PR
# (see version.yml), so there is nothing to bump here: this tags the commit that carries it
# and publishes the notes. main's ruleset admits no bypass actors, and nothing below needs
# one — a tag is not a commit.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write       # the tag and the release
  pull-requests: read   # the descriptions the notes are made of

# Two merges in quick succession must not both try to cut a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: is this merge a release
        id: verdict
        run: |
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          # Exits non-zero when package.json landed *below* the latest release, which is two
          # PRs having computed the same next version. Failing here is the point: the second
          # one's changes would otherwise ship with no release of their own.
          verdict=$(node bin/release.mjs verdict --tag "$tag")
          echo "release=$(jq -r .release <<< "$verdict")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // ""' <<< "$verdict")" >> "$GITHUB_OUTPUT"
          echo "previous=$(jq -r '.previousTag // ""' <<< "$verdict")" >> "$GITHUB_OUTPUT"

      - name: the pull requests since the last release
        if: steps.verdict.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.verdict.outputs.previous }}
        run: |
          # Asked of the API per commit rather than parsed out of commit messages: a squash
          # subject carries `(#12)` and a merge commit does not, and neither is a record.
          for sha in $(git rev-list "${PREVIOUS:+$PREVIOUS..}HEAD"); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '.[] | {number, title, url: .html_url, body}'
          done | jq -s 'unique_by(.number)' > pulls.json

      - name: tag it and publish the notes
        if: steps.verdict.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verdict.outputs.tag }}
          PREVIOUS: ${{ steps.verdict.outputs.previous }}
        run: |
          node bin/release.mjs notes --tag "$TAG" --previous "$PREVIOUS" --repo "$GITHUB_REPOSITORY" < pulls.json > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "rig ${TAG#v}" --notes-file notes.md
