# Every push to main is a release, or says why it is not. The version is worked out here and
# nowhere else (ADR 0004): this gathers the pull requests the push contains and asks
# `bin/release.mjs` what they add up to, then tags that commit and publishes the notes.
#
# There is deliberately almost nothing in this file. The gathering moved into
# `bin/release-gather.mjs` because **nothing tests a workflow**, and every defect found while
# building this path lived in the shell that used to be here. What is left is three `node`
# calls and the plumbing GitHub insists on.
#
# main's ruleset admits no bypass actors, and nothing below needs one — a tag is not a commit.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write       # the tag and the release
  pull-requests: read   # the bumps and the descriptions the notes are made of

# Two merges in quick succession must not both try to cut a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: the pull requests this push contains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          node bin/release-gather.mjs --repo "$GITHUB_REPOSITORY" --previous "$previous" > commits.json

      - name: is this push a release, and of what
        id: verdict
        run: |
          # `--base` is what makes a release the pull requests that landed *here*. A staged work
          # puts every commit in two of them — its stage's, and the work branch's — and only the
          # second landed on this branch; counting both would describe one change several times.
          #
          # Exits non-zero when the set could not be read: a commit with no pull request, or a
          # pull request naming no bump. Nothing is tagged before the set is known, so failing
          # here costs a re-run and never a wrong version.
          verdict=$(node bin/release.mjs verdict --tag "$PREVIOUS" --base "$GITHUB_REF_NAME" < commits.json)
          echo "release=$(jq -r .release <<< "$verdict")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // ""' <<< "$verdict")" >> "$GITHUB_OUTPUT"
          echo "previous=$(jq -r '.previousTag // ""' <<< "$verdict")" >> "$GITHUB_OUTPUT"

      - name: tag it and publish the notes
        if: steps.verdict.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verdict.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.verdict.outputs.previous }}
        run: |
          node bin/release.mjs notes --tag "$TAG" --previous "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" < commits.json > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "rig ${TAG#v}" --notes-file notes.md
