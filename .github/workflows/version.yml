# The PR carries its own version: this check fails until `package.json` says what the PR will
# land as, so the merge to `main` only has to tag it. Runs on label changes too — a label is
# how a PR overrides the bump its branch prefix implies.

name: version

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the tags: the next version is computed from the latest
          # release, and a shallow clone carries none of them.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the version this PR lands as
        env:
          BRANCH: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # The newest release in the repo, not the newest one this branch contains: a branch
          # cut before a release must still land above it.
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          node bin/release.mjs check --tag "$tag" --branch "$BRANCH" --labels "$LABELS"
